<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="asset-provenance-toolkit - provenance embedded in the file the pipeline produces">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f1f28"/>
      <stop offset="100%" stop-color="#0d1a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d3bb"/>
      <stop offset="50%" stop-color="#4c8dff"/>
      <stop offset="100%" stop-color="#56d4b4"/>
    </linearGradient>
    <linearGradient id="markAccent" gradientUnits="userSpaceOnUse" x1="72" y1="108" x2="146" y2="190">
      <stop offset="0%" stop-color="#39d3bb"/>
      <stop offset="60%" stop-color="#4c8dff"/>
      <stop offset="100%" stop-color="#56d4b4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39d3bb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#39d3bb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="960" cy="150" r="230" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <g>
    <rect x="836" y="72" width="196" height="178" rx="12" fill="#10202a" stroke="#2b5a63" stroke-width="2"/>
    <path d="M852 214 L906 156 L946 196 L982 166 L1016 214 Z" fill="#1d4a4a"/>
    <circle cx="884" cy="112" r="16" fill="#39d3bb" opacity="0.75"/>
    <g transform="translate(966,182)">
      <rect width="176" height="72" rx="10" fill="#0d1b26" stroke="#39d3bb" stroke-width="1.6"/>
      <g font-family="ui-monospace, monospace" font-size="11.5" fill="#56d4b4">
        <text x="12" y="22">capability: upscale</text>
        <text x="12" y="40">provider: flux-klein</text>
        <text x="12" y="58">job: 7f3a&#8230;  params: &#123;&#8230;&#125;</text>
      </g>
    </g>
    <path d="M1010 168 L1002 182" stroke="#39d3bb" stroke-width="2"/>
  </g>

  <g transform="translate(72,108)" fill="none" stroke="url(#markAccent)" stroke-width="7" stroke-linecap="round">
    <rect x="8" y="10" width="56" height="60" rx="8"/>
    <path d="M22 40 L34 52 L54 28"/>
  </g>

  <text x="176" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#e6edf3">asset-provenance-toolkit</text>
  <text x="178" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b98a9">The record travels with the asset, not a vendor's database.</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">
    <g transform="translate(178,204)">
      <rect width="166" height="34" rx="17" fill="#0f2a24" stroke="#1f6f5c"/>
      <text x="83" y="22" text-anchor="middle" fill="#56d4b4">PNG native chunks</text>
    </g>
    <g transform="translate(358,204)">
      <rect width="152" height="34" rx="17" fill="#0f2130" stroke="#1f4f7a"/>
      <text x="76" y="22" text-anchor="middle" fill="#6cb6ff">universal sidecar</text>
    </g>
    <g transform="translate(524,204)">
      <rect width="200" height="34" rx="17" fill="#1c1730" stroke="#4a3b7a"/>
      <text x="100" y="22" text-anchor="middle" fill="#b394f7">pixels never re-encoded</text>
    </g>
  </g>

  <text x="178" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5c6b7f">86 tests &#183; capability &#183; provider &#183; params &#183; job id &#183; MIT</text>
</svg>
