[project]
name = "asset-provenance-toolkit"
version = "0.1.0"
description = "Embed and extract generation provenance (capability, provider, params, job id) directly in output files - a provider-agnostic generalization of the PNG-metadata-roundtrip pattern."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Furkiozkann" },
]
keywords = [
    "provenance",
    "metadata",
    "generative-ai",
    "c2pa",
    "reproducibility",
    "exif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "pillow>=11.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
aprov = "asset_provenance_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_provenance_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
