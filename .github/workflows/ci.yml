name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The three versions pyproject.toml claims in its classifiers. A
        # claim nothing checks is a claim, not a fact.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -v

  paket:
    # yayinla.yml only runs on a tag or by hand, so a packaging break would
    # otherwise surface at release time. Build the sdist and wheel, check the
    # metadata PyPI will see, then install the wheel into a clean venv - not
    # the source tree - and run the entry point from it.
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      - name: twine check
        # twine 7 is the first release that accepts Metadata-Version 2.5,
        # which current hatchling writes.
        run: uvx --from 'twine>=7' twine check dist/*

      - name: Install the wheel into a clean venv and run it
        run: |
          uv venv /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/aprov --version
          cd "$(mktemp -d)"
          /tmp/wheel-venv/bin/python -c "from PIL import Image; Image.new('RGB', (8, 8)).save('x.png')"
          /tmp/wheel-venv/bin/aprov embed x.png --capability c --provider p
          /tmp/wheel-venv/bin/aprov verify x.png

  gercek-video:
    # The suite builds its ISO base media files by hand, which is how the
    # chunk-offset assertions can be exact - but a hand-built file is not
    # what the tool gets pointed at. This job encodes real clips and asks a
    # decoder, not a parser, whether the media survived. It also runs the
    # negative control, so a green tick here means the check still bites.
    name: Real encoded media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --group dev

      - name: Embed into real clips and compare decoded output
        run: uv run python arac/gercek-video-dogrula.py
